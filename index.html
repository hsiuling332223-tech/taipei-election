<script>
    function askAI() {
        const question = document.getElementById('userQuestion').value.trim();
        const resultBox = document.getElementById('aiResult');
        
        if (!question) {
            resultBox.innerHTML = "<span style='color: red;'>請先輸入您的問題！</span>";
            return;
        }

        let answer = "";
        
        // 結合最新時事：盧秀燕 / 競總 / 總主委
        if (question.includes("盧秀燕") || question.includes("主委") || question.includes("總部")) {
            answer = "<strong>【Gemini AI 時事快訊分析】</strong><br>針對近期藍營最新動態，台中市長盧秀燕已正式接任蔣萬安競選總部主委。政壇與評論普遍認為這使選戰升級為「雙層選戰」，不僅牽動 2026 台北市長寶座，也提前布局藍營在 2028 的政治板圖。";
        } 
        // 結合最新時事：洋流 / 沈伯洋 / 掃街
        else if (question.includes("洋流") || question.includes("掃街") || question.includes("沈伯洋")) {
            answer = "<strong>【Gemini AI 時事快訊分析】</strong><br>民進黨參選人沈伯洋近期積極深入基層與藍營票倉進行車隊掃街，掀起強大的「大洋流」效應。民調顯示雙方差距縮小，考驗著挑戰者如何將人潮進一步化為實質組織動員。";
        } 
        // 結合最新時事：辯論 / 電視
        else if (question.includes("辯論") || question.includes("政見")) {
            answer = "<strong>【Gemini AI 時事快訊分析】</strong><br>備受矚目的首場台北市長電視辯論會將於 **10 月 31 日**登場，由 TVBS 與三立電視聯合主辦。預期雙方將針對城市防線、交通與各項民生政策正面交鋒。";
        } 
        // 基礎交通議題
        else if (question.includes("交通") || question.includes("松機")) {
            answer = "<strong>【Gemini AI 分析交通議題】</strong><br>蔣萬安陣營主打捷運與定期票穩健延續；沈伯洋陣營則著眼於空間立體化與跨區規劃，提供選民不同的城市願景。";
        } 
        // 預設綜合回應
        else {
            answer = `<strong>【Gemini AI 綜合分析】針對「${question}」：</strong><br>結合 2026 最新選情，目前台北市長選戰呈現蔣萬安（結合盧秀燕防線）對上沈伯洋（「大洋流」旋風）的激烈態勢。您可以試著輸入「盧秀燕」、「洋流」或「辯論」來了解最新時事對應解析！`;
        }

        resultBox.innerHTML = answer;
    }

    function downloadJSON() {
        const data = {
            election: "2026 Taipei Mayor Election",
            latest_news_focus: "Lu Shiow-yen joining campaign & Big Ocean Current rallies",
            candidates: [
                { name: "蔣萬安", party: "國民黨", campaign_chair: "盧秀燕", focus: ["交通優化", "城市韌性"] },
                { name: "沈伯洋", party: "民進黨", movement: "大洋流旋風", focus: ["民防強化", "公共托育升級"] }
            ],
            updated_at: "2026-10-19"
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'taipei_election_2026_live.json';
        a.click();
        URL.revokeObjectURL(url);
    }
</script>
