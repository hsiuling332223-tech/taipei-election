<script>
    // 請確認您的真實 API Key (前後用單引號包好，不要有多餘空白)
    const GEMINI_API_KEY = 'AQ.Ab8RN6K0dU3VaXb73gw_H7IJbtRxgQtvTvFK_boCcatxLnc0mg'; 

    async function askAI() {
        const question = document.getElementById('userQuestion').value.trim();
        const resultBox = document.getElementById('aiResult');
        
        if (!question) {
            resultBox.innerHTML = "<span style='color: red;'>請先輸入您的問題！</span>";
            return;
        }

        resultBox.innerHTML = "<em>⏳ Gemini AI 正在即時運算中，請稍候...</em>";

        // 改用 gemini-1.5-flash 確保相容性
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

        const promptText = `
            你是一個專業的 2026 台北市長選戰 AI 智慧分析助理。
            蔣萬安（國民黨/現任，主打穩健施政、首都防線、交通與城市韌性）。
            沈伯洋（民進黨，主打民防強化、公共托育、車隊掃街掀起「大洋流」旋風）。
            請針對使用者提出的問題：「${question}」，給出專業、客觀的分析回應。
        `;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let aiReply = data.candidates[0].content.parts[0].text;
                aiReply = aiReply.replace(/\n/g, '<br>');
                resultBox.innerHTML = `<strong>【Gemini API 即時智慧分析】</strong><br>${aiReply}`;
            } else {
                console.error(data);
                resultBox.innerHTML = "<span style='color: red;'>無法取得 AI 回應，請檢查 API Key 是否正確或權限是否開通。</span>";
            }
        } catch (error) {
            console.error(error);
            resultBox.innerHTML = "<span style='color: red;'>連線至 Gemini API 發生錯誤。</span>";
        }
    }
</script>
